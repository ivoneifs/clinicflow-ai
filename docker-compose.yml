services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicflow
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: clinicflow
    ports:
      - "5432:5432"
    volumes:
      - clinicflow-local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow -d clinicflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - clinicflow-local-redis:/data

volumes:
  clinicflow-local-postgres:
  clinicflow-local-redis:
